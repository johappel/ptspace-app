services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BACKEND_PORT: "5174"
      PTSPACE_DATA_DIR: /app/ptspace-data
      PTSPACE_RUNTIME_ROOT: /app/ptspace-data
      PTSPACE_WORKSPACES_DIR: /app/ptspace-data/workspace
      PTSPACE_PLANNING_WORKSPACES_DIR: /app/ptspace-data/workspace
      PTSPACE_HARNESS: ${PTSPACE_HARNESS}
      PTSPACE_REAL_HARNESS_ENABLED: ${PTSPACE_REAL_HARNESS_ENABLED}
      PTSPACE_KERNEL_DIR: /app/pedagogical-thinking-space
      PTSPACE_KERNEL_WRITE_ENABLED: ${PTSPACE_KERNEL_WRITE_ENABLED}
      PTSPACE_EXTERNAL_KERNEL_CONTEXT_ENABLED: ${PTSPACE_EXTERNAL_KERNEL_CONTEXT_ENABLED}
      PTSPACE_KERNEL_WRITABLE_DIRS: ${PTSPACE_KERNEL_WRITABLE_DIRS}
      PTSPACE_OPENCODE_RUNNER: ${PTSPACE_OPENCODE_RUNNER}
      PTSPACE_OPENCODE_DOCKER_IMAGE: ${PTSPACE_OPENCODE_DOCKER_IMAGE}
      PTSPACE_OPENCODE_MODEL: ${PTSPACE_OPENCODE_MODEL}
      PTSPACE_OPENCODE_PROVIDER: openrouter
      PTSPACE_OPENCODE_ALLOW_NETWORK: ${PTSPACE_OPENCODE_ALLOW_NETWORK}
      PTSPACE_OPENCODE_TIMEOUT_MS: ${PTSPACE_OPENCODE_TIMEOUT_MS}
      PTSPACE_DEEPSEEK_OPENAI_URL: ${PTSPACE_DEEPSEEK_OPENAI_URL}
      PTSPACE_DEEPSEEK_ADAPTER_API_KEY: ${PTSPACE_DEEPSEEK_ADAPTER_API_KEY}
      PTSPACE_DEEPSEEK_MODEL: ${PTSPACE_DEEPSEEK_MODEL}
      PTSPACE_DEEPSEEK_TIMEOUT_MS: ${PTSPACE_DEEPSEEK_TIMEOUT_MS}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      DEBUG: "opencode*"
    ports:
      - "5174:5174"
    volumes:
      - ${PTSPACE_DATA_DIR}:/app/ptspace-data
      - ${PTSPACE_KERNEL_DIR}:/app/pedagogical-thinking-space
      - /var/run/docker.sock:/var/run/docker.sock

  # OpenAI-kompatibler Headless-Adapter für den DeepSeek Harness (adaptive
  # Runtime). Spawnt pro Request einen frischen `dsh --profile headless`-Turn.
  # Zustandslos; die Modell-Credential liegt im installierten @deepseek-ai/dsh.
  dsh-adapter:
    build:
      context: ./services/dsh-openai-adapter
      dockerfile: Dockerfile
    environment:
      PORT: "3110"
      ADAPTER_HOST: "0.0.0.0"
      # Nicht-Loopback erfordert zwingend einen API-Key (wird vom Adapter
      # aktiv erzwungen). Key nur im Compose-internen Netz relevant.
      ADAPTER_API_KEY: ${PTSPACE_DEEPSEEK_ADAPTER_API_KEY:-dsh-internal}
    ports:
      - "127.0.0.1:3110:3110"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        PUBLIC_BACKEND_URL: http://localhost:5174
    environment:
      PUBLIC_BACKEND_URL: http://localhost:5174
      HOST: 0.0.0.0
      PORT: "5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend
